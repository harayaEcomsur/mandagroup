<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zevra</title>
<!-- Página migrada del hosting anterior (cPanel) — misma URL que usan los QR.
     Optimizada para celular: viewport, imagen fluida y WebP (original de respaldo). -->
<style>
  html, body { margin: 0; background: #000000; }
  main { max-width: 540px; margin: 0 auto; }
  img { display: block; width: 100%; height: auto; }
  .map { position: relative; }
  .map a { position: absolute; display: block; border-radius: 12px; }
  .map a:focus-visible { outline: 3px solid #E0A83E; outline-offset: 2px; }
</style>
</head>
<body>
<main>
<picture><source srcset="costaovo.webp" type="image/webp"><img src="costaovo.png" width="1080" height="1920" alt="Costa OVO" fetchpriority="high"></picture>

<picture><source srcset="infozevradjs.webp" type="image/webp"><img src="infozevradjs.png" width="1080" height="1920" alt="Zevra DJs" loading="lazy"></picture>

<picture><source srcset="infozevra.webp" type="image/webp"><img src="infozevra.png" width="1080" height="1920" alt="Zevra" loading="lazy"></picture>

</main>
</body>
</html>
